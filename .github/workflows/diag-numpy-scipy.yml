name: Diagnostico numpy/scipy (PyInstaller)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Miniconda (conda-forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: condenser-gui
          environment-file: environment.yml
          python-version: '3.11'
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Construir diagnostico con PyInstaller (sin sympy/PySide6 -- rapido)
        shell: bash -el {0}
        run: |
          pyinstaller --onefile --console \
            --name DiagNumpyScipy \
            diag_numpy_scipy.py

      - name: Comprobar que el ejecutable se genero
        shell: bash -el {0}
        run: |
          ls -la dist/
          test -f dist/DiagNumpyScipy.exe

      - name: Subir diagnostico como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DiagNumpyScipy-windows-pyinstaller
          path: dist/DiagNumpyScipy.exe
          retention-days: 30
