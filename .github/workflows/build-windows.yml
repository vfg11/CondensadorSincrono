name: Build Windows Executable (PyInstaller)

on:
  push:
    branches: [ main ]
    paths:
      - '01_model/**'
      - '02_linearization/**'
      - '05_gui/**'
      - 'environment.yml'
      - 'main_app.spec'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Miniconda (conda-forge -- necesario para slycot en Windows)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: condenser-gui
          environment-file: environment.yml
          python-version: '3.11'
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Verificar que todas las dependencias importan
        shell: bash -el {0}
        run: |
          python -c "import PySide6, control, slycot, scipy, numpy, matplotlib, sympy, PyInstaller; print('Todas las dependencias OK')"

      - name: Construir ejecutable con PyInstaller
        shell: bash -el {0}
        run: |
          pyinstaller main_app.spec --noconfirm --clean

      - name: Comprobar que el ejecutable se genero
        shell: bash -el {0}
        run: |
          ls -la dist/
          test -f dist/CondensadorSincronoGUI.exe

      - name: Subir ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CondensadorSincronoGUI-windows
          path: dist/CondensadorSincronoGUI.exe
          retention-days: 30
