name: Build Windows Executable (Nuitka)

on:
  push:
    branches: [ main ]
    paths:
      - '01_model/**'
      - '02_linearization/**'
      - '05_gui/**'
      - 'environment.yml'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Miniconda (conda-forge -- necesario para slycot en Windows)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: condenser-gui
          environment-file: environment.yml
          python-version: '3.11'
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict

      - name: Verificar que todas las dependencias importan
        shell: bash -el {0}
        run: |
          python -c "import PySide6, control, slycot, scipy, numpy, matplotlib, sympy, nuitka; print('Todas las dependencias OK')"

      - name: Cache del directorio de cache de Nuitka (acelera ejecuciones futuras)
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-cache-${{ runner.os }}-${{ hashFiles('environment.yml') }}
          restore-keys: |
            nuitka-cache-${{ runner.os }}-

      # Copia todos los .py necesarios (01_model, 02_linearization,
      # 05_gui) a UNA sola carpeta antes de compilar. Sin esto, Nuitka
      # no encuentra "genqec_model"/"controls"/"linearize_condenser" en
      # tiempo de ejecucion (ModuleNotFoundError) porque esos modulos
      # viven en carpetas hermanas del punto de entrada, y el proyecto
      # los localiza en ejecucion normal via sys.path -- un truco que
      # Nuitka no resuelve automaticamente al compilar. Copiarlos todos
      # juntos evita depender de PYTHONPATH (con sus propias
      # ambiguedades de separador ':' vs ';' entre bash y Windows).
      - name: Preparar carpeta de compilacion (unificar modulos)
        shell: bash -el {0}
        run: |
          rm -rf build_staging
          mkdir build_staging
          cp 01_model/*.py build_staging/
          cp 02_linearization/linearize_condenser.py build_staging/
          cp 05_gui/*.py build_staging/
          ls -la build_staging/

      - name: Construir ejecutable con Nuitka
        shell: bash -el {0}
        run: |
          python -m nuitka \
            --mode=onefile \
            --enable-plugin=pyside6 \
            --windows-console-mode=force \
            --force-stdout-spec="{PROGRAM_BASE}.out.txt" \
            --force-stderr-spec="{PROGRAM_BASE}.err.txt" \
            --mingw64 \
            --lto=no \
            --assume-yes-for-downloads \
            --show-progress \
            --output-dir=dist \
            --output-filename=CondensadorSincronoGUI.exe \
            --include-package-data=matplotlib \
            --company-name="Estudio Condensador Sincrono" \
            --product-name="CondensadorSincronoGUI" \
            --file-version=1.0.0.0 \
            --product-version=1.0.0.0 \
            build_staging/main_app.py

      - name: Comprobar que el ejecutable se genero
        shell: bash -el {0}
        run: |
          ls -la dist/
          test -f dist/CondensadorSincronoGUI.exe

      - name: Subir ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CondensadorSincronoGUI-windows
          path: dist/CondensadorSincronoGUI.exe
          retention-days: 30
